# Android app: builds the web bundle, syncs Capacitor and produces
#   - a signed AAB (Play upload) + signed APK when the signing secrets exist
#   - a debug APK otherwise (still useful for testers)
# Secrets (Settings → Secrets and variables → Actions) — see docs/APP.md:
#   KEYSTORE_BASE64            base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD          keystore password
#   KEY_ALIAS                  key alias inside the keystore
#   KEY_PASSWORD               key password
#   GOOGLE_SERVICES_JSON_BASE64  (optional) base64 of android/app/google-services.json → enables push
name: App · Android

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
  pull_request:
    paths: ['android/**', 'src/native/**', 'capacitor.config.json', 'package.json', '.github/workflows/app-android.yml']

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NQ_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci

      - name: Unit tests (adhan schedule)
        run: npm run test:native

      - name: google-services.json (push)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          # the secret may hold the JSON file itself or its base64
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | grep -q '"project_info"'; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r' > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/google-services.json
          fi
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));assert any(c['client_info']['android_client_info']['package_name']=='net.nuralquran.app' for c in d['client']);print('google-services.json ok:',d['project_info']['project_id'])" \
            || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not a valid google-services.json for net.nuralquran.app"; exit 1; }
          echo "VITE_NQ_PUSH=1" >> "$GITHUB_ENV"

      - name: Web build + cap sync android
        run: npm run build:android

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "NQ_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release AAB + APK (signed)
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          NQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NQ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NQ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Debug APK (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: nur-al-quran-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
