# iOS app (macOS runner).
#   Always: web build → cap sync ios → unsigned Release build for the device
#           (proves the project, Swift packages and resources compile).
#   With signing secrets: archive + export a signed .ipa (App Store Connect) and,
#           if the App Store Connect API key is set, upload it to TestFlight.
# Secrets — see docs/APP.md:
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD   Apple Distribution certificate (.p12)
#   IOS_PROVISION_PROFILE_BASE64                       App Store provisioning profile for net.nuralquran.app
#   IOS_TEAM_ID                                        Apple Developer Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64       (optional) App Store Connect API key → TestFlight upload
name: App · iOS

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
  pull_request:
    paths: ['ios/**', 'src/native/**', 'capacitor.config.json', 'package.json', '.github/workflows/app-ios.yml']

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Owner rule: every iOS build must use the iOS 27 SDK or newer (newest available preferred).
    # GitHub keys macOS images to the Xcode major version: move to xcode-28 (etc.) when it is GA.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      NQ_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require iOS 27 SDK or newer
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          xcodebuild -version
          echo "iPhoneOS SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 27 ]; then
            echo "::error::iOS SDK $SDK is older than 27. Owner rule: build with the iOS 27 SDK or newer (Xcode 27+)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (adhan schedule)
        run: npm run test:native

      - name: Push enabled?
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        if: env.IOS_TEAM_ID != ''
        run: echo "VITE_NQ_PUSH=1" >> "$GITHUB_ENV"

      - name: Web build + cap sync ios
        run: npm run build:ios

      - name: Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "NQ_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unsigned build (device)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$NQ_VERSION" CURRENT_PROJECT_VERSION="$NQ_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 40

      - name: Signing setup
        id: signing
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        if: env.P12 != '' && env.PROFILE != '' && env.TEAM_ID != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/nq.keychain-db"; KEYCHAIN_PW="$(uuidgen)"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive + export .ipa
        if: steps.signing.outputs.signed == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$NQ_VERSION" CURRENT_PROJECT_VERSION="$NQ_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>net.nuralquran.app</key><string>${PROFILE_UUID}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p ios-out && cp "$RUNNER_TEMP"/export/*.ipa ios-out/

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f ios-out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nq.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" ~/.appstoreconnect/private_keys/*.p8

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: nur-al-quran-ios-${{ github.run_number }}
          path: ios-out/*.ipa
