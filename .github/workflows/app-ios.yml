# iOS app (macOS runner).
#   Always: web build → cap sync ios → unsigned Release build for the device
#           (proves the project, Swift packages and resources compile).
#   With signing secrets: archive + export a signed .ipa (App Store Connect) and,
#           if the App Store Connect API key is set, upload it to TestFlight.
# Secrets — see docs/APP.md:
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD   Apple Distribution certificate (.p12)
#   IOS_PROVISION_PROFILE_BASE64                       App Store provisioning profile for net.nuralquran.app
#   IOS_TEAM_ID                                        Apple Developer Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64       App Store Connect API key (Admin) → TestFlight upload
# Simplest setup (no Mac needed): set only IOS_TEAM_ID + the three ASC_* secrets. The build then
# signs automatically: Xcode creates/renews the distribution certificate and the App Store
# profile in the cloud through the API key, and uploads the build to TestFlight.
name: App · iOS

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
  pull_request:
    paths: ['ios/**', 'src/native/**', 'capacitor.config.json', 'package.json', '.github/workflows/app-ios.yml']

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Owner rule: every iOS build must use the iOS 27 SDK or newer (newest available preferred).
    # GitHub keys macOS images to the Xcode major version: move to xcode-28 (etc.) when it is GA.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      NQ_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require iOS 27 SDK or newer
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          xcodebuild -version
          echo "iPhoneOS SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 27 ]; then
            echo "::error::iOS SDK $SDK is older than 27. Owner rule: build with the iOS 27 SDK or newer (Xcode 27+)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (adhan schedule)
        run: npm run test:native

      - name: Push enabled?
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        if: env.IOS_TEAM_ID != ''
        run: echo "VITE_NQ_PUSH=1" >> "$GITHUB_ENV"

      - name: Web build + cap sync ios
        run: npm run build:ios

      - name: Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "NQ_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unsigned build (device)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$NQ_VERSION" CURRENT_PROJECT_VERSION="$NQ_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 40

      - name: Signing setup
        id: signing
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        if: env.P12 != '' && env.PROFILE != '' && env.TEAM_ID != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/nq.keychain-db"; KEYCHAIN_PW="$(uuidgen)"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive + export .ipa
        if: steps.signing.outputs.signed == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$NQ_VERSION" CURRENT_PROJECT_VERSION="$NQ_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>net.nuralquran.app</key><string>${PROFILE_UUID}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p ios-out && cp "$RUNNER_TEMP"/export/*.ipa ios-out/

      - name: Archive + upload (automatic signing with the App Store Connect API key)
        if: steps.signing.outputs.signed != 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "No signing secrets: unsigned build only."; exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # the secret may hold the .p8 file itself (-----BEGIN PRIVATE KEY-----…) or its base64
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" | tr -d '\r' > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 -D > "$KEY" 2>/dev/null \
              || printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KEY"
          fi
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect key. Open AuthKey_<KeyID>.p8 in Notepad and paste its whole content (with the BEGIN/END lines) into that secret."
            echo "decoded size: $(wc -c < "$KEY") bytes; first line: $(head -1 "$KEY" | cut -c1-30)"
            exit 1
          fi
          case "$ASC_KEY_ID" in *[!A-Z0-9]*|"") echo "::error::ASC_KEY_ID should be the 10-character Key ID (letters/digits only)"; exit 1;; esac
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive signed "to run locally" (ad-hoc identity "-"): the entitlements (push, associated
          # domains, Sign in with Apple, time-sensitive) are embedded, and no development profile / registered device is
          # needed. The export below re-signs for the App Store with Apple's cloud-managed
          # distribution certificate and an App Store profile, both created through the API key.
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$NQ_VERSION" CURRENT_PROJECT_VERSION="$NQ_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" AD_HOC_CODE_SIGNING_ALLOWED=YES archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          # the signed app must carry the capabilities (Apple silently drops push otherwise)
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          ENT=$(codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app 2>/dev/null)
          echo "$ENT" | grep -E "aps-environment|associated-domains|applesignin|time-sensitive|application-identifier" || true
          for k in aps-environment com.apple.developer.associated-domains com.apple.developer.applesignin; do
            echo "$ENT" | grep -q "$k" || { echo "::error::signed app is missing the $k entitlement"; exit 1; }
          done
          codesign -dv "$RUNNER_TEMP"/ipa/Payload/*.app 2>&1 | grep -E "Authority=|TeamIdentifier" || true
          mkdir -p ~/.appstoreconnect/private_keys && cp "$KEY" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY"
          echo "Uploaded build $NQ_VERSION ($NQ_BUILD_NUMBER) to App Store Connect → TestFlight."

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8_BASE64" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8; fi
          xcrun altool --upload-app -f ios-out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nq.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" ~/.appstoreconnect/private_keys/*.p8

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: nur-al-quran-ios-${{ github.run_number }}
          path: ios-out/*.ipa
