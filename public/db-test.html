<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>DB Test</title>
<style>
body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; direction: ltr; }
button { padding: 10px 20px; margin: 5px; background: #4a90d9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.ok { color: #52b788; } .err { color: #f87171; } .info { color: #93c5fd; }
pre { background: #0d1117; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>🔍 Supabase DB Test</h2>
<button onclick="testAll()">▶ Run All Tests</button>
<button onclick="createTestRoom()">➕ Create Test Room</button>
<button onclick="clearLog()">🗑 Clear</button>
<div id="log"></div>

<script type="module">
// Read env from meta tags injected by build — fallback to prompting user
const SUPABASE_URL  = prompt('Enter your SUPABASE_URL (e.g. https://xxx.supabase.co)') || '';
const SUPABASE_ANON = prompt('Enter your SUPABASE_ANON_KEY') || '';

function log(msg, type='info') {
  const d = document.getElementById('log');
  d.innerHTML += `<pre class="${type}">${msg}</pre>`;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

async function getClient() {
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  return createClient(SUPABASE_URL, SUPABASE_ANON);
}

window.testAll = async function() {
  clearLog();
  log('=== Starting DB Tests ===');
  const sb = await getClient();

  // Test 1: Can we connect?
  log('\n[1] Testing connection...');
  try {
    const { data, error } = await sb.from('group_khatmat').select('count').limit(1);
    if (error) log('❌ group_khatmat table: ' + JSON.stringify(error), 'err');
    else log('✅ group_khatmat table EXISTS — count: ' + JSON.stringify(data), 'ok');
  } catch(e) { log('❌ Exception: ' + e.message, 'err'); }

  // Test 2: Can we read parts?
  log('\n[2] Testing group_khatma_parts...');
  try {
    const { data, error } = await sb.from('group_khatma_parts').select('count').limit(1);
    if (error) log('❌ group_khatma_parts table: ' + JSON.stringify(error), 'err');
    else log('✅ group_khatma_parts table EXISTS', 'ok');
  } catch(e) { log('❌ Exception: ' + e.message, 'err'); }

  // Test 3: List all rooms
  log('\n[3] Listing all rooms...');
  try {
    const { data, error } = await sb.from('group_khatmat').select('*').order('created_at', {ascending: false}).limit(10);
    if (error) log('❌ List rooms error: ' + JSON.stringify(error), 'err');
    else log('✅ Rooms found: ' + data.length + '\n' + JSON.stringify(data, null, 2), 'ok');
  } catch(e) { log('❌ Exception: ' + e.message, 'err'); }
};

window.createTestRoom = async function() {
  const sb = await getClient();
  const testId = 'TEST1';
  log('\n[INSERT] Creating test room ID: ' + testId);
  
  const { data, error } = await sb.from('group_khatmat').insert({
    id: testId,
    deceased_name: 'اختبار',
    mode: 'juz',
    is_public: true,
    completions: 0,
    created_by: null,
  }).select();

  if (error) log('❌ Insert error:\n' + JSON.stringify(error, null, 2), 'err');
  else log('✅ Room created!\n' + JSON.stringify(data, null, 2), 'ok');
};

window.clearLog = clearLog;
</script>
</body>
</html>
