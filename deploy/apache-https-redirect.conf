# http://nuralquran.net → https://nuralquran.net, except AutoSSL's checks.
# http://www.nuralquran.net goes straight to https://nuralquran.net (one 301).
# Install as /etc/apache2/conf.d/userdata/std/2_4/CPANEL_USER/nuralquran.net/nuralquran-https.conf
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTP_HOST} ^www\.nuralquran\.net(:80)?$ [NC]
RewriteRule ^ https://nuralquran.net%{REQUEST_URI} [R=301,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
