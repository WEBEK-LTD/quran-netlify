# nuralquran.net through host.webek.org: visitors reach this server, whose Apache
# fetches every page from Netlify. Netlify's addresses never reach the visitor, so
# the site works where netlify.app is blocked (the same setup as yallapp.com.tr).
#
# Install as /etc/apache2/conf.d/userdata/ssl/2_4/CPANEL_USER/nuralquran.net/nuralquran-proxy.conf
# (deploy/install-proxy.sh does it). NETLIFY_SITE = the site's name on Netlify,
# without ".netlify.app".

# One address for search engines: https://www → https://nuralquran.net in one 301.
# AutoSSL's checks under /.well-known/ are left alone.
RewriteEngine On
RewriteCond %{HTTP_HOST} ^www\.nuralquran\.net(:443)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://nuralquran.net%{REQUEST_URI} [R=301,L]

ProxyRequests Off
ProxyPreserveHost Off
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCheckPeerExpire On
SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

# AutoSSL renews this domain's certificate through /.well-known on this server.
ProxyPass /.well-known/ !

# The API is served by PHP on this server (public_html/api), never proxied.
ProxyPass /api/ !

ProxyPass / https://NETLIFY_SITE.netlify.app/ timeout=60 keepalive=On
ProxyPassReverse / https://NETLIFY_SITE.netlify.app/

RequestHeader set X-Forwarded-Proto "https"
