    <!-- ═══ Fonts ════════════════════════════════════════════════════════════ -->
    <script>
      /* Apply the saved appearance before first paint (no flash). Mirrors src/appearance.js. */
      (function () {
        try {
          var r = document.documentElement, a = {};
          try { a = JSON.parse(localStorage.getItem("nq_appearance") || "{}") || {}; } catch (e) {}
          var m = a.mode || (localStorage.getItem("nq_theme") === "light" ? "light" : "auto");
          var dark = m === "dark" || m === "contrast" || (m === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
          r.setAttribute("data-mode", m);
          r.setAttribute("data-scheme", dark ? "dark" : "light");
          r.setAttribute("data-cb", a.cb ? "on" : "off");
          r.setAttribute("data-reduce", a.reduce ? "on" : "off");
          if (a.size && a.size !== 100) r.style.fontSize = (16 * a.size / 100) + "px";
        } catch (e) {}
      })();
    </script>
    <style>
      /* App opening screen (src/native/launch.js removes it). Hidden on the website. */
      #nq-launch { display:none; }
      html.nq-launching #nq-launch { display:flex; position:fixed; inset:0; z-index:2147483000; flex-direction:column; align-items:center; justify-content:center; gap:22px;
        background:
          radial-gradient(1.2px 1.2px at 12% 18%, rgba(246,223,160,.55) 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 12%, rgba(246,223,160,.45) 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 64% 34%, rgba(246,223,160,.35) 50%, transparent 51%),
          radial-gradient(1px 1px at 22% 62%, rgba(246,223,160,.4) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 86% 70%, rgba(246,223,160,.4) 50%, transparent 51%),
          radial-gradient(1px 1px at 40% 86%, rgba(246,223,160,.35) 50%, transparent 51%),
          radial-gradient(1px 1px at 8% 90%, rgba(246,223,160,.3) 50%, transparent 51%),
          radial-gradient(1px 1px at 55% 8%, rgba(246,223,160,.3) 50%, transparent 51%),
          radial-gradient(120% 70% at 50% 38%, #17503A 0%, #0B2A1E 45%, #06100C 100%);
        transition:opacity .45s ease; }
      #nq-launch::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.9;
        background-image:radial-gradient(rgba(246,223,160,.08) 1px, transparent 1.2px); background-size:22px 22px;
        -webkit-mask-image:radial-gradient(70% 55% at 50% 42%, #000 0%, transparent 80%); mask-image:radial-gradient(70% 55% at 50% 42%, #000 0%, transparent 80%); }
      #nq-launch .nq-l-glow { position:absolute; left:50%; top:42%; width:340px; height:340px; transform:translate(-50%,-50%); border-radius:50%;
        background:radial-gradient(circle, rgba(212,174,92,.28) 0%, rgba(212,174,92,0) 65%); opacity:0; animation:nqLGlow 1.6s ease-out .15s forwards; }
      #nq-launch .nq-l-mark { position:relative; width:112px; height:auto; opacity:0; transform:scale(.9); filter:drop-shadow(0 10px 28px rgba(0,0,0,.45)); animation:nqLIn .8s cubic-bezier(.2,.8,.2,1) .1s forwards; }
      #nq-launch .nq-l-line { position:relative; width:0; height:1px; background:linear-gradient(90deg, transparent, #D4AE5C, transparent); animation:nqLLine .7s ease-out .55s forwards; }
      #nq-launch .nq-l-word { position:relative; width:210px; height:auto; opacity:0; transform:translateY(8px); animation:nqLUp .7s ease-out .4s forwards; }
      html.nq-launch-out #nq-launch { opacity:0; }
      @keyframes nqLIn { to { opacity:1; transform:none; } }
      @keyframes nqLUp { to { opacity:1; transform:none; } }
      @keyframes nqLLine { to { width:150px; } }
      @keyframes nqLGlow { 0% { opacity:0; } 60% { opacity:1; } 100% { opacity:.75; } }
      @media (prefers-reduced-motion: reduce) {
        #nq-launch .nq-l-mark, #nq-launch .nq-l-word, #nq-launch .nq-l-glow { animation:none; opacity:1; transform:none; }
        #nq-launch .nq-l-line { animation:none; width:150px; }
      }
    </style>
    <script>
      /* Inside the native app only: show the opening screen from the very first paint. */
      (function () {
        try {
          if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) {
            var r = document.documentElement;
            r.classList.add("nq-launching");
            // safety net: never keep the opening screen if the app code failed to start
            setTimeout(function () { r.classList.remove("nq-launching"); }, 8000);
          }
        } catch (e) {}
      })();
    </script>

    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Not inside the native app: it ships the build offline already, and a SW there
      // would only serve stale copies after an app update (src/native/index.js).
      var nqNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if ('serviceWorker' in navigator && !nqNative) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
