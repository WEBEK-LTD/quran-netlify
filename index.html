      <script>
        (function () {
          var root = document.documentElement;
          if (!root.classList.contains("nq-launching")) return;
          if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          var cv = document.getElementById("nq-launch-fx"), ctx = cv.getContext("2d");
          var dpr = Math.min(window.devicePixelRatio || 1, 2), W, H, cx, cy, t0 = performance.now(), P = [];
          function size() { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; cx = W / 2; cy = H * 0.41; }
          size(); addEventListener("resize", size);
          function spawn(init) {
            var a = Math.random() * Math.PI * 2, d = (0.35 + Math.random() * 0.65) * Math.max(W, H) * 0.6;
            return { x: cx + Math.cos(a) * d, y: (init ? Math.random() * H : H + Math.random() * H * 0.2), r: (0.6 + Math.random() * 1.8) * dpr,
                     s: (0.25 + Math.random() * 0.9) * dpr, tw: Math.random() * 6.28, life: 0 };
          }
          for (var i = 0; i < 70; i++) P.push(spawn(true));
          (function frame(now) {
            if (!document.getElementById("nq-launch")) return;
            var el = (now - t0) / 1000, pull = Math.min(1, el / 1.6);
            ctx.clearRect(0, 0, W, H);

              var p = P[i]; p.life += 0.016;
              var dx = cx - p.x, dy = cy - p.y, dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.x += dx / dist * p.s * 0.9 * pull + Math.sin(p.tw + el * 2) * 0.15 * dpr;
              p.y += dy / dist * p.s * 0.9 * pull - p.s * 0.6;
              if (dist < 40 * dpr || p.y < -10) { P[i] = spawn(false); continue; }
              var a = Math.min(1, p.life * 1.5) * (0.35 + 0.65 * Math.abs(Math.sin(p.tw + el * 3))) * Math.min(1, dist / (140 * dpr));
